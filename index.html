<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brazil Delivery Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F7; --panel:#FFFFFF; --panel2:#E8EDF2; --line:#D3DCE5; --ink:#0F2740; --muted:#5A7088;
  --brand:#C8000F; --s1:#1F6FBF; --s2:#D9731A; --s3:#2A9C8A; --s4:#8A9BB0;
  --warn:#B7791F; --ok:#2F855A;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1F33; --panel:#12304D; --panel2:#0F2A44; --line:#21476B; --ink:#E8EEF5; --muted:#8FA6BD;
    --brand:#FF3B46; --s1:#4A9AE8; --s2:#F5953A; --s3:#57C7B5; --s4:#5F7893; --warn:#E8B04A; --ok:#5CC28A;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1F33; --panel:#12304D; --panel2:#0F2A44; --line:#21476B; --ink:#E8EEF5; --muted:#8FA6BD;
  --brand:#FF3B46; --s1:#4A9AE8; --s2:#F5953A; --s3:#57C7B5; --s4:#5F7893; --warn:#E8B04A; --ok:#5CC28A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--cond);font-weight:600;line-height:1.15;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--panel)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:14px}
.top h1{font-size:30px;letter-spacing:.2px}
.top h1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:36px;width:auto;display:block}
.logo-white{display:none}
.top h1 .ttl{padding-left:14px;border-left:1px solid var(--line)}
.prefs{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:6px}
.prefs .langs,.prefs .styles{display:inline-flex;gap:4px;margin:0}
.logo-foot{display:none}
@media (max-width:640px){.logo{height:28px}.top h1{font-size:24px}.top h1 .ttl{padding-left:0;border-left:0}}
.top .meta{color:var(--muted);font-size:14px;text-align:right}
.top .meta strong{color:var(--ink);font-weight:600}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:600 16px var(--cond);color:var(--muted);background:none;border:0;padding:12px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
nav.tabs button:focus-visible,select:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
main{padding:22px 0 48px}
section.view{display:none}
section.view.on{display:block}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;min-width:0}
.panel h2{font-size:19px;margin-bottom:10px}
.panel h2 small{font:400 13px var(--body);color:var(--muted);margin-left:6px}
.mt{margin-top:16px}
.chart{position:relative;height:260px}
.chart.tall{height:340px}
/* lifecycle strip */
.life{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 20px 16px}
.life .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
.life .big{font:700 64px/0.9 var(--cond);letter-spacing:-1px}
.life .head p{margin:0;color:var(--muted);max-width:60ch}
.bar{display:flex;height:46px;border-radius:4px;overflow:hidden;gap:2px;background:var(--line)}
.bar div{min-width:38px;display:flex;align-items:center;justify-content:center;font:700 18px var(--cond);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);white-space:nowrap;overflow:hidden}
@media (max-width:640px){.bar div{min-width:30px;font-size:15px}}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin-top:14px}
.legend .it{border-left:4px solid var(--c);padding-left:10px}
.legend .n{font:700 28px/1 var(--cond)}
.legend .l{color:var(--muted);font-size:13px}
.kpi .n{font:700 40px/1 var(--cond)}
.kpi .l{color:var(--muted);font-size:14px;margin-top:4px}
.kpi .d{font-size:13px;margin-top:6px}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:4px 0}
.alert{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.alert:first-of-type{border-top:0}
.pill{display:inline-block;font:600 12px var(--body);padding:1px 8px;border-radius:10px;white-space:nowrap;border:1px solid currentColor}
.pill.hi{color:var(--brand)} .pill.md{color:var(--warn)} .pill.lo{color:var(--muted)} .pill.ok{color:var(--ok)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.filters label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
select,input[type=search]{font:15px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 14px var(--body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--s1);background:var(--panel2)}
.tblwrap{overflow-x:auto}
/* tabelas paginadas: 10 linhas por página, altura fixa, cabeçalho fixo ao rolar */
.tblwrap.paged{height:var(--tbl-h,600px);overflow:auto}
.tblwrap.paged thead th{position:sticky;top:0;background:var(--panel);z-index:1}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.pager .chip{padding:4px 10px;font-size:13px}
.pager .chip[disabled]{opacity:.4;cursor:default}
.filters .note{align-self:center;font-size:13px;color:var(--muted)}
.mapgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:16px;align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
#rMap{height:460px;border-radius:4px;border:1px solid var(--line);background:var(--panel2)}
.leaflet-container{font-family:var(--body)}
.maplegend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.maplegend i{display:inline-block;width:22px;height:10px;border-radius:2px}
.ufrank{list-style:none;margin:0;padding:0;font-size:14px}
.ufrank li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ufrank li:hover b{text-decoration:underline}
.ufrank .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;gap:0}
.ufrank .bar span{display:block;height:100%;background:var(--s1)}
.ufrank em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted)}
.uflbl{font:700 12px/16px var(--cond);color:var(--ink);text-align:center;text-shadow:0 0 3px var(--panel),0 0 3px var(--panel),0 0 2px var(--panel);pointer-events:none;white-space:nowrap}
.maptip b{font-family:var(--cond);font-size:15px}
.yearsel{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:auto}
.yearsel select{min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 14px var(--cond);text-align:left;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap;cursor:pointer;user-select:none}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.exp td.detail{color:var(--muted);font-size:13px}
.count{color:var(--muted);font-size:13px;margin:8px 0 0}
.pill.tag{color:var(--s1);margin-left:6px;font-size:11px;vertical-align:1px}
.mjd{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;padding:4px 0 8px;color:var(--ink)}
.mjd h4{margin:0 0 4px;font:600 14px var(--cond);color:var(--muted)}
.mjd p{margin:0;white-space:pre-line;font-size:13px;line-height:1.45}
.mjd ul{margin:0;padding-left:16px;font-size:13px}
td .pill{white-space:normal;line-height:1.3;display:inline-block}
#tOpen td:nth-child(1),#tOpen td:nth-child(2){max-width:130px}
#tItr td:nth-child(2),#tItr td:nth-child(3){max-width:170px}
#tItr td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.sup{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.sup b{font:700 20px/1.2 var(--cond)}
.acts{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.gatebox{max-width:540px;margin:60px auto;text-align:center}
.gatebox p{color:var(--muted)}
.gatebox p.err{color:var(--brand)}
.chip.primary{background:var(--s1);color:#fff;border-color:var(--s1);padding:10px 18px;font-size:16px}
.chip[disabled]{opacity:.6;cursor:wait}
[hidden]{display:none!important}
.langs{display:inline-flex;gap:4px;margin-bottom:6px}
.chip.sm{padding:2px 9px;font-size:13px}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding:16px 0}
/* logo com texto branco no tema escuro */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-navy{display:none}:root:not([data-theme="light"]) .logo-white{display:block}}
:root[data-theme="dark"] .logo-navy{display:none}
:root[data-theme="dark"] .logo-white{display:block}

/* ===== Estilo "Relatório D&S": mesma identidade do PPT semanal ===== */
:root[data-style="report"]{
  --bg:#DCE6F2; --panel:#FFFFFF; --panel2:#EEF3F9; --line:#C9D6E6; --ink:#0C2340; --muted:#4A5F7A;
  --brand:#C8102E; --s1:#155F82; --s2:#E97132; --s3:#196B24; --s4:#0F9ED5; --warn:#B7791F; --ok:#2F855A;
  --navy:#0C2340; --navy2:#0A1B30; --accent:#8FB4E3;
  --body:"Aptos","Segoe UI",Calibri,Arial,sans-serif;
  --cond:"Aptos Narrow","Aptos","Arial Narrow","Segoe UI",sans-serif;
}
[data-style="report"] header.top{background:var(--navy);border-bottom:0}
[data-style="report"] .logo-navy{display:none}
[data-style="report"] .logo-white{display:block}
[data-style="report"] .top h1{color:#fff;text-transform:uppercase;font-weight:700;font-size:28px;letter-spacing:.01em}
[data-style="report"] .top h1 .ttl{border-left-color:#2B4A70}
[data-style="report"] .top .meta{color:#B9C9DE}
[data-style="report"] .top .meta strong{color:var(--accent)}
[data-style="report"] .top .chip{background:transparent;color:#B9C9DE;border-color:#2B4A70}
[data-style="report"] .top .chip[aria-pressed="true"]{color:#fff;border-color:var(--accent);background:#17365C}
[data-style="report"] nav.tabs{background:var(--navy2);border-bottom:0}
[data-style="report"] nav.tabs button{color:#B9C9DE;text-transform:uppercase;font:700 14px var(--cond);letter-spacing:.03em}
[data-style="report"] nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--accent)}
[data-style="report"] .panel,[data-style="report"] .life{border:0;border-radius:14px;box-shadow:0 2px 8px rgba(12,35,64,.12)}
[data-style="report"] .panel h2,[data-style="report"] .life h2{text-transform:uppercase;color:var(--navy);font-weight:700;font-size:17px;letter-spacing:.02em}
[data-style="report"] .panel h2 small{text-transform:none;letter-spacing:0}
[data-style="report"] .kpi{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 14px}
[data-style="report"] .kpi .l{order:-1;margin:0 0 6px;text-transform:uppercase;font:700 13px/1.25 var(--cond);color:var(--navy);letter-spacing:.02em}
[data-style="report"] .kpi .n{color:var(--navy);font-size:42px}
[data-style="report"] .kpi .d{color:var(--muted)}
/* caixas escuras do topo do relatório: resumo, riscos e próximos passos */
[data-style="report"] #v-exec .g3>.panel{background:var(--navy2);color:#E3EAF3;box-shadow:none}
[data-style="report"] #v-exec .g3>.panel h2{color:#fff}
[data-style="report"] #v-exec .g3>.panel li::marker{color:var(--accent)}
[data-style="report"] #v-exec .g3>.panel .alert{border-top-color:rgba(255,255,255,.14)}
[data-style="report"] #v-exec .g3>.panel .pill.hi{color:#FF7A7A}
[data-style="report"] #v-exec .g3>.panel .pill.md{color:#F5B04A}
[data-style="report"] th{color:var(--navy)}
[data-style="report"] .tblwrap.paged thead th{background:var(--panel)}
[data-style="report"] footer{background:var(--navy);color:#B9C9DE;border-top:0}
[data-style="report"] footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
[data-style="report"] .logo-foot{display:block;height:28px;width:auto;flex:none}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1><img class="logo logo-navy" src="logo-dahua-navy.png" alt="Dahua Technology" width="520" height="155"><img class="logo logo-white" src="logo-dahua-white.png" alt="Dahua Technology" width="520" height="155"><span class="ttl" data-i18n="title"></span></h1>
    <div class="meta">
      <div class="prefs">
        <div class="styles" role="group" data-i18n-aria="styleAria"><button class="chip sm" data-style="panel" aria-pressed="true" data-i18n="stPanel"></button><button class="chip sm" data-style="report" aria-pressed="false" data-i18n="stReport"></button></div>
        <div class="langs" role="group" aria-label="Idioma / Language"><button class="chip sm" data-lang="pt" aria-pressed="true">PT</button><button class="chip sm" data-lang="en" aria-pressed="false">EN</button></div>
      </div>
      <span id="mWeek"></span><br><span id="mSrc"></span>
      <div class="acts" id="acts" hidden><span id="mUser"></span><button class="chip" id="bRefresh" data-i18n="refresh"></button><button class="chip" id="bOut" data-i18n="signOut"></button></div></div>
  </div>
</header>
<nav class="tabs" data-i18n-aria="tabsAria">
  <div class="wrap" role="tablist">
    <button role="tab" data-v="exec" aria-selected="true" data-i18n="tabExec"></button>
    <button role="tab" data-v="proj" aria-selected="false" data-i18n="tabProj"></button>
    <button role="tab" data-v="sup" aria-selected="false" data-i18n="tabSup"></button>
    <button role="tab" data-v="rma" aria-selected="false" data-i18n="tabRma"></button>
    <button role="tab" data-v="risk" aria-selected="false" data-i18n="tabRisk"></button>
  </div>
</nav>
<div class="wrap" id="gate"><div class="panel gatebox"><h2 data-i18n="gateTitle"></h2><p id="gMsg"></p><button class="chip primary" id="bIn" hidden data-i18n="signIn"></button></div></div>
<main class="wrap" id="app" hidden>

<section class="view on" id="v-exec">
  <div class="life">
    <div class="head"><span class="big" id="lifeTotal"></span><div><h2 id="lifeTitle"></h2><p id="lifeText"></p></div>
      <label class="yearsel"><span data-i18n="fYear"></span><select id="eY"></select></label></div>
    <div class="bar" id="lifeBar" role="img"></div>
    <div class="legend" id="lifeLegend"></div>
  </div>
  <div class="grid g4 mt" id="kpis"></div>
  <div class="grid g3 mt">
    <div class="panel"><h2 id="hSummaryT" data-i18n="hSummary"></h2><p id="resumo" style="margin:0"></p><h2 class="mt" data-i18n="hHighlights"></h2><ul class="plain" id="destaques"></ul></div>
    <div class="panel"><h2 data-i18n="hAlerts"></h2><div id="alertas"></div></div>
    <div class="panel"><h2 data-i18n="hNext"></h2><ul class="plain" id="proximos"></ul></div>
  </div>
  <div class="panel mt"><h2 data-i18n="hSuperv"></h2><div class="sup" id="superv"></div></div>
</section>

<section class="view" id="v-proj">
  <div class="filters">
    <label><span data-i18n="fShow"></span><select id="fS"><option value="active" data-i18n="showActive"></option><option value="all" data-i18n="showAll"></option><option value="major" data-i18n="showMajor"></option></select></label>
    <label id="fYwrap"><span data-i18n="fYear"></span><select id="fY"><option value="" data-i18n="all"></option></select></label>
    <label><span data-i18n="fType"></span><select id="fT"><option value="" data-i18n="all"></option></select></label>
    <label><span data-i18n="fLevel"></span><select id="fL"><option value="" data-i18n="all"></option></select></label>
    <label><span data-i18n="fPhase"></span><select id="fP"><option value="" data-i18n="allF"></option></select></label>
    <label><span data-i18n="fInd"></span><select id="fI"><option value="" data-i18n="allF"></option></select></label>
    <label><span data-i18n="fSearch"></span><input type="search" id="fQ" data-i18n-ph="searchPh"></label>
  </div>
  <div class="grid g4" id="pKpis"></div>
  <div class="grid g2 mt">
    <div class="panel"><h2><span data-i18n="hLevel"></span><small data-i18n="sLevel"></small></h2><div class="chart"><canvas id="cLevel"></canvas></div></div>
    <div class="panel"><h2 id="hPhaseT" data-i18n="hPhase"></h2><div class="chart"><canvas id="cPhase"></canvas></div></div>
  </div>
  <div class="panel mt"><h2><span data-i18n="hInd"></span><small data-i18n="sInd"></small></h2><div class="chart"><canvas id="cInd"></canvas></div></div>
  <div class="panel mt" id="pnlMajor" hidden><h2 data-i18n="hMajorTbl"></h2>
    <div class="tblwrap paged"><table id="tMajor"><thead><tr>
      <th data-k="nome" data-i18n="cProject"></th><th data-k="pm">Delivery PM</th><th data-k="l" data-i18n="cLevel"></th><th data-k="ph" data-i18n="cStage"></th><th data-k="amt" class="num" data-i18n="cValue"></th><th data-k="inc" class="num" data-i18n="cIncome"></th><th data-k="nc" class="num" data-i18n="cContracts"></th><th data-k="upd" data-i18n="cUpdated"></th>
    </tr></thead><tbody></tbody></table></div><p class="count" data-i18n="mjClick"></p><p class="count" data-i18n="majorSrc"></p>
  </div>
  <div class="panel mt" id="pnlProj"><h2 id="hProjTbl"></h2>
    <div class="tblwrap paged"><table id="tProj"><thead><tr>
      <th data-k="nome" data-i18n="cProject"></th><th data-k="yr" class="num" data-i18n="fYear"></th><th data-k="pm">PM</th><th data-k="c" data-i18n="cClass"></th><th data-k="t" data-i18n="cType"></th><th data-k="l" data-i18n="cLevel"></th><th data-k="ph" data-i18n="cPhase"></th><th data-k="amt" class="num" data-i18n="cContract"></th>
    </tr></thead><tbody></tbody></table></div><p class="count" id="pCount"></p>
  </div>
</section>

<section class="view" id="v-sup">
  <div class="filters">
    <label><span data-i18n="fYear"></span><select id="sY"></select></label>
    <label><span data-i18n="cResp"></span><select id="sR"><option value="" data-i18n="all"></option></select></label>
    <span class="note" id="sNote" hidden data-i18n="ccNoResp"></span>
  </div>
  <div class="grid g4" id="sKpis"></div>
  <div class="panel mt"><h2><span data-i18n="hCC"></span><small data-i18n="sCC"></small></h2><div class="chart tall"><canvas id="cCC"></canvas></div></div>
  <div class="grid g2 mt">
    <div class="panel"><h2 data-i18n="hCh"></h2><div class="chart"><canvas id="cCh"></canvas></div></div>
    <div class="panel"><h2><span data-i18n="hWk"></span><small data-i18n="sWk"></small></h2><div class="chart"><canvas id="cWk"></canvas></div></div>

  msalApp.setActiveAccount(acc);
  try {
    return (await msalApp.acquireTokenSilent({ scopes: SCOPES, account: acc })).accessToken;
  } catch (e) {
    if (e instanceof msal.InteractionRequiredAuthError) { await msalApp.acquireTokenRedirect({ scopes: SCOPES }); }
    throw e;
  }
}

async function graph(path, token) {
  const r = await fetch(path.startsWith('http') ? path : GRAPH + path, { headers: { Authorization: 'Bearer ' + token } });
  if (!r.ok) {
    let detail = ''; try { detail = (await r.json()).error?.message || ''; } catch (e) {}
    const err = new DashError('errGeneric', { m: detail || ('HTTP ' + r.status) }, 'http'); err.status = r.status; throw err;
  }
  return r.json();
}

/* Link de compartilhamento -> id aceito pelo endpoint /shares do Graph */
function shareId(url) {
  const b64 = btoa(unescape(encodeURIComponent(url))).replace(/=+$/, '').replace(/\//g, '_').replace(/\+/g, '-');
  return 'u!' + b64;
}

async function listFolder(token) {
  let root;
  const tries = [CFG.folderUrl, CFG.folderUrl.split('?')[0]];
  for (const u of [...new Set(tries)]) {
    try { root = await graph('/shares/' + shareId(u) + '/driveItem', token); break; }
    catch (e) { if (u === tries[tries.length - 1]) throw e; }
  }
  const items = [];
  let next = `/drives/${root.parentReference.driveId}/items/${root.id}/children?$top=200`;
  while (next) { const j = await graph(next, token); items.push(...j.value); next = j['@odata.nextLink']; }
  return { root, items };
}

/* Escolhe o .xlsx mais recente cujo nome bate com o padrão configurado */
function pickFile(items, key) {
  const re = new RegExp(CFG.files[key], 'i');
  const hits = items.filter(i => i.file && /\.xlsx$/i.test(i.name) && re.test(i.name))
    .sort((a, b) => new Date(b.lastModifiedDateTime) - new Date(a.lastModifiedDateTime));
  if (!hits.length) throw new DashError('errFile', { p: CFG.files[key] }, 'file');
  return hits[0];
}

async function readWorkbook(item, token, sheets) {
  const r = item['@microsoft.graph.downloadUrl']
    ? await fetch(item['@microsoft.graph.downloadUrl'])
    : await fetch(`${GRAPH}/drives/${item.parentReference.driveId}/items/${item.id}/content`, { headers: { Authorization: 'Bearer ' + token } });
  if (!r.ok) throw new DashError('errDownload', { n: item.name, s: r.status }, 'file');
  const buf = new Uint8Array(await r.arrayBuffer());
  return XLSX.read(buf, Object.assign({ type: 'array', cellDates: true }, sheets ? { sheets } : {}));
}

/* ----- conversão das abas para o formato usado pelo painel ----- */
const pad = n => String(n).padStart(2, '0');
const iso = d0 => { const d = new Date(d0.getTime() + 12 * 3600e3); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }; // +12h evita virar o dia por fuso horário
function clean(v) {
  if (v === undefined || v === null) return null;
  if (v instanceof Date) return isNaN(v) ? null : iso(v);
  if (typeof v === 'string') { v = v.trim(); return ['', '0', '#N/A', '-', 'nan'].includes(v) ? null : v; }
  return v;
}
/* chave de pessoa: primeiro nome sem acento e sem o ID entre parênteses ("Octávio" = "Octavio Jose Spirandeli(123)") */
const personKey = v => v ? String(v).replace(/\(.*?\)/g, '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase().split(/\s+/)[0] || null : null;
const num = v => { v = clean(v); if (v === null) return null; const n = Number(v); return isNaN(n) ? v : n; };
function sheet(wb, name) {
  const ws = wb.Sheets[name];
  if (!ws) throw new DashError('errSheet', { s: name }, 'file');
  return ws;
}
function mapRows(ws, mp) {
  return XLSX.utils.sheet_to_json(ws, { defval: null, raw: true }).map(r => {
    const o = {}; for (const k in mp) o[k] = clean(r[mp[k]]); return o;
  });
}

function parseProjetos(wb) {
  const projects = mapRows(sheet(wb, 'ProjectList'), { id: 'Contract No', yr: 'Import Year', c: 'Report Classification', t: 'Project Type', l: 'Project Level', ph: 'Project Phase', n: 'Project Resumed Name', cn: 'Contract Name', pm: 'Local Project Manager', pm2: 'Project Manager', ind: 'Industry Line One', amt: 'Contract Amount(USD)', cust: 'Customer Of Party A', sign: 'Contract Sign Date', opp: 'Opportunity Num' });
  projects.forEach(p => { p.yr = num(p.yr); p.amt = num(p.amt); });
  const support = mapRows(sheet(wb, 'Technical Support'), { itr: 'ITR Number', cust: 'Customer', cat: 'Product Category', resp: 'Dahua Brasil Responsible', st: 'Status', wo: 'Week Open', wc: 'Week Close', rs: 'Report Status', own: 'Owner Ticket', ag: 'Aging Bucket', prod: 'Product / Model', start: 'Start Time' })
    .filter(s => s.st || s.cust);
  support.forEach(s => {
    s.wo = num(s.wo); s.wc = num(s.wc); if (s.prod) s.prod = String(s.prod).slice(0, 140);
    // só é ITR quando a coluna "ITR Number" tem um número de caso da HQ (ex.: F202607080033, ERR250925005)
    const m = s.itr ? String(s.itr).match(/\b(F\d{12}|ERR\d{9})/) : null;
    s.itr = m ? m[1] : null;
    s.rk = personKey(s.resp);
    s.yr = s.start ? +String(s.start).slice(0, 4) : null;
  });
  /* a aba não tem coluna de ano: usa o ano da Start Time; ticket sem data fica no ano mais recente da planilha */
  const tsYear = Math.max(0, ...support.map(s => s.yr || 0)) || new Date().getFullYear();
  support.forEach(s => { if (!s.yr) s.yr = tsYear; });
  // Call Center: localiza o cabeçalho "Mês" e lê as linhas seguintes até a primeira sem data
  const rows = XLSX.utils.sheet_to_json(sheet(wb, 'Call Center'), { header: 1, defval: null, raw: true, blankrows: true });
  const callCenter = [];
  const hr = rows.findIndex(r => r && r.some(c => typeof c === 'string' && c.trim() === 'Mês'));
  if (hr < 0) throw new DashError('errCallHdr', null, 'file');
  const c0 = rows[hr].findIndex(c => typeof c === 'string' && c.trim() === 'Mês');
  for (let i = hr + 1; i < rows.length; i++) {
    const r = rows[i] || []; if (!(r[c0] instanceof Date)) break;
    callCenter.push({ mes: iso(r[c0]), lig: num(r[c0 + 1]), wpp: num(r[c0 + 2]), sup: num(r[c0 + 3]), rma: num(r[c0 + 4]), tot: num(r[c0 + 5]) });
  }
  return { projects, support, callCenter, itrs: parseItr(wb), major: parseMajor(wb) };
}

/* Aba "Major Projects": oportunidades acompanhadas. Status "Win" = oportunidade que virou projeto.
   Liga com a ProjectList pelo código: Project Code (aqui) = Opportunity Num (lá). Opcional: sem a aba, a opção some. */
function parseMajor(wb) {
  const ws = wb.Sheets['Major Projects'];
  if (!ws) return null;
  return mapRows(ws, { code: 'Project Code', name: 'Project Name', level: 'Project Level', stage: 'Project Stage', status: 'Project Status',
      amt10k: 'Project Amount(10K_USD)', inc: 'Total Income(USD)', pm: 'Delivery PM', pmA: 'Delivery PM\n(Assigned)', pmB: 'Delivery PM\n(To be assigned)',
      ind: 'Primary Industry', itype: 'Industry Type', endUser: 'End User', partner: 'Partner Name', progDate: 'Project Latest Progress Date',
      prog: 'Project Latest Progress', nextDate: 'Next Plan Date', next: 'Next Plan', risk: 'Project Risk' })
    .filter(r => r.code || r.name)
    .map(r => Object.assign(r, { amt10k: num(r.amt10k), inc: num(r.inc), pm: r.pm || r.pmA || r.pmB, status: r.status ? String(r.status).trim() : null }));
}

/* Aba "ITR database": export da base de ITRs da HQ. Opcional: se não existir, o bloco de ITR some. */
function parseItr(wb) {
  const ws = wb.Sheets['ITR database'];
  if (!ws) return null;
  return mapRows(ws, { id: 'Case Number', type: 'Case Type', y: 'Year', mo: 'Submitted month', st: 'Status', age: 'Aging', cust: 'Customer Name', line: 'Product line', subj: 'Subject', owner: 'Case Owner' })
    .filter(r => r.id).map(r => Object.assign(r, { y: num(r.y), mo: num(r.mo), age: num(r.age), rk: personKey(r.owner) }));
}

function parseRma(wb) {
  const rma = mapRows(sheet(wb, 'Database'), { sc: 'Service Center', y: 'Year', m: 'Month', st: 'Status', d: 'Days', dur: 'Duration', uf: 'State', reg: 'Region', w: 'FWarranty', model: 'model', cust: 'CUSTOMER' })
    .filter(r => r.sc);
  rma.forEach(r => { r.y = num(r.y); r.d = num(r.d); if (r.m) r.m = String(r.m).toLowerCase(); });
  return { rma };
}

function parseRiscos(wb) {
  const name = wb.SheetNames.filter(n => /^RAT/i.test(n)).pop();
  if (!name) throw new DashError('errRat', null, 'file');
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true }).slice(1);
  const risks = rows.filter(r => r[1] || r[4]).map(r => {
    const o = { owner: clean(r[0]), project: clean(r[1]), imp: clean(r[2]), type: clean(r[3]), title: clean(r[4]), prog: clean(r[5]), st: clean(r[9]), ag: clean(r[14]), fup: clean(r[15]) };
    if (o.imp) o.imp = String(o.imp).trim();
    if (o.prog && String(o.prog).length > 400) o.prog = String(o.prog).slice(0, 400) + '…';
    if (o.prog) o.prog = String(o.prog);
    return o;
  });
  return { risks, ratSheet: name };
}

async function loadData() {
  const token = await getToken();
  const { items } = await listFolder(token);
  const fP = pickFile(items, 'projetos'), fR = pickFile(items, 'rma'), fK = pickFile(items, 'riscos');
  const [wP, wR, wK, rep] = await Promise.all([
    readWorkbook(fP, token, ['ProjectList', 'Technical Support', 'Call Center', 'ITR database', 'Major Projects']),
    readWorkbook(fR, token, ['Database']),
    readWorkbook(fK, token),
    fetch('report.json', { cache: 'no-store' }).then(r => r.json())
  ]);
  const k = parseRiscos(wK);
  const db = Object.assign({}, parseProjetos(wP), parseRma(wR), { risks: k.risks });
  const files = [fP, fR, fK].map(f => ({ name: f.name, mod: f.lastModifiedDateTime }));
  files[2].sheet = k.ratSheet;
  return { db, rep, files, loadedAt: new Date() };
}

function friendlyError(e) {
  if (e && e.key) return t(e.key, e.vars);
  const m = String(e && (e.errorMessage || e.message) || e);
  if (/AADSTS65001|consent/i.test(m)) return t('errConsent');
  if (/AADSTS50011|redirect/i.test(m)) return t('errRedirect');
  return t('errGeneric', { m });
}
function friendlyErrorStatus(e) {
  if (e && (e.status === 401 || e.status === 403 || e.status === 404)) return t('errAccess');
  return friendlyError(e);
}

const PAGE=10, pages={};
/* rows: lista de <tr> já montados; volta pra página 1 quando o conteúdo da lista muda (filtro, ordenação, idioma) */
function paged(tid,rows,emptyHtml){
  const tb=document.querySelector('#'+tid+' tbody'), wrap=tb.closest('.tblwrap');
  const sig=rows.length+'|'+(rows[0]||'').length+'|'+(rows[0]||'').slice(0,200);
  const st=pages[tid]||(pages[tid]={p:0,sig:''});
  if(st.sig!==sig){st.p=0;st.sig=sig;}
  st.rows=rows; st.empty=emptyHtml;
  const n=rows.length, last=Math.max(0,Math.ceil(n/PAGE)-1); if(st.p>last) st.p=last;
  tb.innerHTML=n?rows.slice(st.p*PAGE,st.p*PAGE+PAGE).join(''):emptyHtml;
  wrap.scrollTop=0;
  let pg=wrap.nextElementSibling; if(!pg||!pg.classList.contains('pager')){pg=document.createElement('div');pg.className='pager';wrap.after(pg);
    pg.addEventListener('click',e=>{const b=e.target.closest('button[data-d]');if(!b||b.disabled)return;const s2=pages[tid];s2.p+=+b.dataset.d;paged(tid,s2.rows,s2.empty);});}
  pg.hidden=n<=PAGE;
  pg.innerHTML=`<span>${t('pgInfo',{a:fmt(st.p*PAGE+1),b:fmt(Math.min(n,st.p*PAGE+PAGE)),n:fmt(n)})}</span><button class="chip" data-d="-1" ${st.p===0?'disabled':''}>‹ ${t('pgPrev')}</button><button class="chip" data-d="1" ${st.p>=last?'disabled':''}>${t('pgNext')} ›</button>`;
}

  if(!MAPGEO||!MAPARGS) return;
  const LL=window.L, [cur,open,Y]=MAPARGS, src=mapMode==='open'?open:cur;
  const by={}; src.forEach(r=>{ if(!r.uf) return; const u=String(r.uf).toUpperCase(); const o=by[u]||(by[u]={n:0,iw:0,oow:0,op:0}); o.n++; if(r.w==='IW')o.iw++; else if(r.w==='OOW')o.oow++; if(r.st==='Open')o.op++; });
  const max=Math.max(0,...Object.values(by).map(o=>o.n));
  /* 5 faixas em escala logarítmica: SP concentra a maioria e esmagaria a escala linear */
  const steps=max?[1,2,3,4,5].map(i=>Math.max(1,Math.round(Math.exp(Math.log(max)*i/5)))):[];
  const band=n=>!n?-1:steps.findIndex(s=>n<=s);
  const op=[.22,.38,.55,.72,.9], blue=css('--s1'), line=css('--panel'), none=css('--line');
  const style=f=>{const n=(by[f.properties.sigla]||{}).n||0, b=band(n); return {color:line,weight:1,fillColor:b<0?none:blue,fillOpacity:b<0?.35:op[b]};};
  if(MAPLAYER) MAP.removeLayer(MAPLAYER);
  MAPLAYER=LL.geoJSON(MAPGEO,{style,onEachFeature:(f,l)=>{
    const u=f.properties.sigla, o=by[u];
    l.bindTooltip(`<div class="maptip"><b>${u} – ${esc(UF_NAME[u]||f.properties.name)}</b><br>${o?`${t('mapTipN',{n:fmt(o.n)})}<br>IW ${fmt(o.iw)} · OOW ${fmt(o.oow)}${mapMode==='all'?' · '+t('mapTipOpen',{n:fmt(o.op)}):''}`:t('mapTipNone')}</div>`,{sticky:true});
    l.on({mouseover:e=>e.target.setStyle({weight:2.5,color:css('--ink')}),mouseout:e=>MAPLAYER.resetStyle(e.target)});
  }}).addTo(MAP);
  if(!MAP._fitted){ MAP.fitBounds(MAPLAYER.getBounds(),{padding:[8,8]}); MAP._fitted=true; }
  /* quantidade escrita em cada estado que tem RMA (o detalhe continua no tooltip) */
  if(MAPLBL) MAP.removeLayer(MAPLBL);
  MAPLBL=LL.layerGroup(Object.entries(by).filter(([u])=>UF_LBL[u]).map(([u,o])=>LL.marker(UF_LBL[u],{interactive:false,keyboard:false,
    icon:LL.divIcon({className:'uflbl',html:fmt(o.n),iconSize:[44,16],iconAnchor:[22,8]})}))).addTo(MAP);
  $('#mapSub').textContent=String(Y)+(mapMode==='open'?' · '+t('mapOpen').toLowerCase():'');
  $('#mapLegend').innerHTML=steps.length?`<span>${t('mapScale')}</span>`+steps.map((s,i)=>`<i style="background:${blue};opacity:${op[i]}"></i><span>${i===0?'1':fmt((steps[i-1]||0)+1)}–${fmt(s)}</span>`).filter((x,i)=>i===0||steps[i]>steps[i-1]).join(''):'';
  const rank=Object.entries(by).sort((a,b)=>b[1].n-a[1].n), tot=src.length, noUf=src.filter(r=>!r.uf).length;
  $('#ufRank').innerHTML=rank.slice(0,10).map(([u,o])=>`<li data-uf="${u}"><b>${u}</b><span class="bar"><span style="width:${(o.n/max*100).toFixed(1)}%"></span></span><em>${fmt(o.n)} · ${Math.round(o.n/tot*100)}%</em></li>`).join('')||`<li>${t('mapNoData')}</li>`;
  $('#ufNote').textContent=(rank.length>10?t('mapMore',{n:rank.length-10})+' ':'')+(noUf?t('mapNoUf',{n:fmt(noUf)}):'');
}
$('#ufRank').addEventListener('click',e=>{const li=e.target.closest('li[data-uf]'); if(!li||!MAPLAYER) return; MAPLAYER.eachLayer(l=>{ if(l.feature.properties.sigla===li.dataset.uf){ MAP.fitBounds(l.getBounds(),{maxZoom:6}); l.openTooltip(l.getBounds().getCenter()); } });});
$$('#mapMode .chip').forEach(c=>c.addEventListener('click',()=>{mapMode=c.dataset.m;$$('#mapMode .chip').forEach(x=>x.setAttribute('aria-pressed',x===c));drawMap();}));

/* ===== Riscos ===== */
function renderHot(){ paged('tHot',rp('hotRisks').map(h=>`<tr><td><strong>${esc(h.cliente)}</strong></td><td>${esc(h.tema)}</td><td>${esc(h.info)}</td></tr>`),''); }
function setupRisk(){
  const kp=$('#kP').value; $('#kP').length=1;
  [...new Set(DB.risks.map(r=>r.project).filter(Boolean))].sort().forEach(p=>$('#kP').insertAdjacentHTML('beforeend',`<option>${esc(p)}</option>`)); $('#kP').value=[...$('#kP').options].some(o=>o.value===kp)?kp:'';
  renderHot();
  if(BOUND) return;
  ['#kS','#kI','#kP'].forEach(s=>$(s).addEventListener('change',renderRisk));
  $('#tRat tbody').addEventListener('click',e=>{const tr=e.target.closest('tr[data-i]');if(!tr)return;const nx=tr.nextElementSibling;if(nx&&nx.classList.contains('exp')){nx.remove();return;}
    const r=DB.risks[+tr.dataset.i];tr.insertAdjacentHTML('afterend',`<tr class="exp"><td class="detail" colspan="7">${esc(r.prog||t('noProg'))}</td></tr>`);});
}
function renderRisk(){
  renderHot();
  const S=$('#kS').value,I=$('#kI').value,P=$('#kP').value;
  const rows=DB.risks.map((r,i)=>({...r,i})).filter(r=>r.title&&(!S||r.st===S)&&(!I||r.imp===I)&&(!P||r.project===P));
  $('#kKpis').innerHTML=[[rows.filter(r=>r.imp==='High').length,t('kImpHigh')],[rows.filter(r=>r.ag==='> 30 days').length,t('kOver30r')],[new Set(rows.map(r=>r.project)).size,t('kProjInv')]]
    .map(([n,l])=>`<div class="panel kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  const ic=v=>v==='High'?'hi':v==='Medium'?'md':'lo', IMP={High:t('impHigh'),Medium:t('impMedium'),Low:t('impLow')};
  const AG={'> 30 days':t('age3'),'08 ~ 30 days':t('age2'),'0~7 days':t('age1'),'Closed':t('agClosed')};
  rows.sort((a,b)=>['High','Medium','Low'].indexOf(a.imp)-['High','Medium','Low'].indexOf(b.imp));
  paged('tRat',rows.map(r=>`<tr data-i="${r.i}" style="cursor:pointer"><td>${esc(r.project)}</td><td>${esc(r.owner)}</td><td>${r.type==='Risk'?t('tRisk'):t('tIssue')}</td><td>${esc(r.title)}</td><td><span class="pill ${ic(r.imp)}">${IMP[r.imp]||esc(r.imp)}</span></td><td>${esc(AG[r.ag]||r.ag)}</td><td>${fdate(r.fup)}</td></tr>`),`<tr><td colspan="7">${t('noRat')}</td></tr>`);
}

/* ===== Navegação, tema e idioma ===== */
const renders={exec:renderExec,proj:renderProj,sup:renderSup,rma:renderRma,risk:renderRisk};
let cur='exec';
function show(v){cur=v;$$('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));$$('section.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));renders[v]();try{localStorage.setItem('tab',v)}catch(e){}}
$$('nav.tabs button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
$$('#sPer .chip').forEach(c=>c.addEventListener('click',()=>{sPer=+c.dataset.p;$$('#sPer .chip').forEach(x=>x.setAttribute('aria-pressed',x===c));renderSup();}));
const rerender=()=>{ if(DB) renders[cur](); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rerender);
new MutationObserver(rerender).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','data-style']});
/* Estilo visual: "panel" (padrão, segue claro/escuro do sistema) ou "report" (identidade do PPT semanal, sempre claro) */
let STYLE=(()=>{ try{ const q=new URLSearchParams(location.search).get('style'); if(q==='report'||q==='panel') return q; const v=localStorage.getItem('style'); if(v==='report'||v==='panel') return v; }catch(e){} return 'panel'; })();
const FONT={panel:'Barlow, system-ui, -apple-system, Segoe UI, Roboto, sans-serif', report:'Aptos, "Segoe UI", Calibri, Arial, sans-serif'};
function applyStyle(){
  const r=document.documentElement;
  if(typeof Chart!=='undefined') Chart.defaults.font.family=FONT[STYLE];
  if(STYLE==='report'){ r.setAttribute('data-theme','light'); r.setAttribute('data-style','report'); }
  else { r.removeAttribute('data-style'); r.removeAttribute('data-theme'); }
  $$('.styles .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.style===STYLE));
}
$$('.styles .chip').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.style===STYLE) return; STYLE=b.dataset.style; try{localStorage.setItem('style',STYLE)}catch(e){} applyStyle(); }));

function applyStatic(){
  document.documentElement.lang = LANG==='pt'?'pt-BR':'en';
  document.title = t('title');
  $$('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  $$('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh);});
  $$('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.i18nAria));});
  $$('.langs .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG));
}
/* semana ISO 8601 (segunda a domingo), a mesma numeração do report semanal e da coluna Week Open */
function isoWeek(d0){ const d=new Date(Date.UTC(d0.getFullYear(),d0.getMonth(),d0.getDate())); const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day); const y0=new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil(((d-y0)/864e5+1)/7); }
function renderMeta(){
  if(!REP||!LOAD) { $('#mWeek').innerHTML=''; return; }
  /* semana e data vêm da última alteração dos arquivos de dados na pasta, não do report.json */
  const last=LOAD.files.reduce((a,f)=>{const d=new Date(f.mod);return !a||d>a.d?{d,f}:a;},null);
  if(last){
    const d=last.d, dt=d.toLocaleDateString(LOC(),LANG==='pt'?{day:'2-digit',month:'2-digit',year:'numeric'}:{month:'short',day:'numeric',year:'numeric'}), hm=pad(d.getHours())+':'+pad(d.getMinutes());
    $('#mWeek').innerHTML=t('weekLine',{w:isoWeek(d),d:esc(dt),h:hm});
    $('#mWeek').title=t('weekTip',{n:last.f.name});
  }
  /* os textos do resumo continuam sendo os do report.json: o título mostra de qual semana eles são */
  $('#hSummaryT').textContent=REP.semana?t('hSummaryW',{w:REP.semana}):t('hSummary');
  const hh=LOAD.loadedAt; $('#mSrc').textContent=LOAD.srcErr?t('refreshFail',{m:LOAD.srcErr()}):t('source',{h:pad(hh.getHours())+':'+pad(hh.getMinutes())});
  const fl=LOAD.files.map(f=>t('fileLine',{n:f.name,d:new Date(f.mod).toLocaleString(LOC(),{dateStyle:'short',timeStyle:'short'})})+(f.sheet?t('sheetLine',{s:f.sheet}):''));
  $('#foot').textContent=t('foot',{f:fl.join('; ')});
}
function setLang(l){
  if(l===LANG) return; LANG=l; try{localStorage.setItem('lang',l)}catch(e){}
  applyStatic(); renderMeta(); if(gateState) gateMsg(gateState.fn,gateState.isErr,gateState.showLogin);
  if(DB){ setupProj(); renderHot(); rerender(); }
}
$$('.langs .chip').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

const gate=$('#gate'),app=$('#app');
let gateState=null;
/* fn: função que devolve o texto, para poder trocar o idioma com a mensagem na tela */
function gateMsg(fn,isErr,showLogin){gateState={fn,isErr,showLogin};$('#gMsg').textContent=fn();$('#gMsg').classList.toggle('err',!!isErr);$('#bIn').hidden=!showLogin;gate.hidden=false;app.hidden=true;}
let loading=false;
async function refresh(first){
  if(loading) return; loading=true; $('#bRefresh').disabled=true; $('#bRefresh').textContent=t('refreshing');
  try{
    const d=await loadData(); DB=d.db; REP=d.rep; LOAD=d;
    renderMeta();
    setupExec(); setupProj(); setupSup(); setupRma(); setupRisk(); BOUND=true;
    gateState=null; gate.hidden=true; app.hidden=false; $('#acts').hidden=false;
    if(first){let tb='exec'; try{tb=localStorage.getItem('tab')||'exec'}catch(e){} show(renders[tb]?tb:'exec');} else rerender();
  }catch(e){
    console.error(e);
    if(e&&e.kind==='login') gateMsg(()=>t('needLogin'),false,true);
    else if(first||app.hidden) gateMsg(()=>friendlyErrorStatus(e),true,true);
    else { LOAD.srcErr=()=>friendlyErrorStatus(e); renderMeta(); LOAD.srcErr=null; }
  }finally{loading=false; $('#bRefresh').disabled=false; $('#bRefresh').textContent=t('refresh');}
}
$('#bIn').addEventListener('click',()=>msalApp.loginRedirect({scopes:SCOPES,prompt:'select_account'}));
$('#bOut').addEventListener('click',()=>msalApp.logoutRedirect({postLogoutRedirectUri:location.origin+location.pathname}));
$('#bRefresh').addEventListener('click',()=>refresh(false));
(async()=>{
  applyStyle();
  applyStatic();
  if(!CFG||!CFG.clientId||CFG.clientId.startsWith('COLE')){gateMsg(()=>t('cfgIncomplete'),true,false);return;}
  gateMsg(()=>t('connecting'),false,false);
  try{ await msalApp.initialize(); const res=await msalApp.handleRedirectPromise(); if(res&&res.account) msalApp.setActiveAccount(res.account); }
  catch(e){ gateMsg(()=>friendlyError(e),true,true); return; }
  const acc=msalApp.getActiveAccount()||msalApp.getAllAccounts()[0];
  if(!acc){gateMsg(()=>t('needLogin'),false,true);return;}
  $('#mUser').textContent=acc.name||acc.username;
  gateMsg(()=>t('loadingFolder'),false,false);
  await refresh(true);
  const mins=+CFG.refreshMinutes||0;
  if(mins>0) setInterval(()=>{ if(document.visibilityState==='visible'&&!app.hidden) refresh(false); }, mins*60000);
})();
</script>
</body>
